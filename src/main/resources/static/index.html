<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARDOK - Movie Recommendations</title>
    <style>
        body { 
            background-color: #000; 
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('image.png'); 
            background-size: cover;
            background-attachment: fixed;
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            overflow-x: hidden; 
        }
        
        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px); border-bottom: 2px solid #e50914;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 2rem; font-weight: bold; color: #e50914; letter-spacing: 3px; }
        .nav-btn {
            text-decoration: none; color: #fff; padding: 8px 20px;
            margin-left: 10px; border: 1px solid #e50914; border-radius: 5px; transition: 0.3s;
            font-weight: bold;
        }
        .nav-btn:hover { background: #e50914; box-shadow: 0 0 10px #e50914; }

        /* Hero Section */
        .hero { padding: 60px 20px; }
        h1 { font-size: 4.5rem; color: #e50914; margin: 0; text-shadow: 2px 2px 10px #000; }
        h2 { font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; }
        
        /* Mood Buttons */
        .mood-box { 
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 12px; margin: 30px auto; max-width: 900px;
        }
        .mood-btn {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; cursor: pointer; border-radius: 20px;
            font-size: 0.9rem; transition: 0.3s;
        }
        .mood-btn:hover { 
            background: #e50914; border-color: #e50914; transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
        }

        /* Movie Grid */
        .movie-grid {
            margin: 40px auto; display: grid; gap: 25px; max-width: 1200px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            padding: 0 20px;
        }
        .movie-card {
            background: #141414; border-radius: 8px; overflow: hidden;
            border: 1px solid #333; text-align: left;
            cursor: pointer; transition: 0.4s ease;
        }
        .movie-card:hover { border-color: #e50914; transform: scale(1.05); z-index: 10; }
        .movie-card-info { padding: 15px; }
        .movie-card h4 { color: #e50914; margin: 0; font-size: 1.1rem; }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95); overflow-y: auto;
        }
        .modal-content {
            background-color: #111; margin: 2% auto; width: 70%; 
            border-radius: 12px; overflow: hidden; border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        .modal-info { padding: 40px; color: #ddd; }
        .close { 
            position: absolute; right: 30px; top: 20px; color: #fff; 
            font-size: 40px; cursor: pointer; z-index: 2100;
        }
        iframe { width: 100%; height: 450px; border: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">ARDOK</div>
        <div id="user-section">
            <a href="/oauth2/authorization/google" class="nav-btn">Sign In</a>
        </div>
    </nav>

    <div class="hero">
        <h1>ARDOK</h1>
        <h2>EXPLORE MOVIES BY YOUR VIBE</h2>
        
        <div class="mood-box">
            <button onclick="getMovies('Happy')" class="mood-btn">😊 Happy</button>
            <button onclick="getMovies('Mind-bending')" class="mood-btn">🌀 Mind-bending</button>
            <button onclick="getMovies('Epic')" class="mood-btn">⚔️ Epic</button>
            <button onclick="getMovies('Sad')" class="mood-btn">😢 Sad</button>
            <button onclick="getMovies('Eerie')" class="mood-btn">👻 Eerie</button>
            <button onclick="getMovies('Thoughtful')" class="mood-btn">🤔 Thoughtful</button>
            <button onclick="getMovies('Chill')" class="mood-btn">🧘 Chill</button>
            <button onclick="getMovies('Quirky')" class="mood-btn">🌈 Quirky</button>
        </div>
        
        <div id="movie-results" class="movie-grid"></div>
    </div>

    <div id="movieModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // --- 1. User Authentication Check ---
        fetch('/api/user/status')
            .then(res => res.json())
            .then(data => {
                if(data.loggedIn) {
                    document.getElementById('user-section').innerHTML = 
                        `<span style="margin-right:15px; font-weight:bold;">Hi, ${data.name}!</span>` +
                        `<a href="/logout" class="nav-btn" style="background:#333; border:none;">Logout</a>`;
                }
            });

        // --- 2. Movie Fetching Logic ---
        function getMovies(mood) {
            const resultsDiv = document.getElementById('movie-results');
            resultsDiv.innerHTML = `<p style="grid-column: 1/-1; font-size:1.2rem;">Scanning ${mood} vibes...</p>`;

            fetch('/api/movies/' + mood)
                .then(res => res.json())
                .then(movies => {
                    resultsDiv.innerHTML = "";
                    if (movies.length === 0) {
                        resultsDiv.innerHTML = `<p style="color:#e50914; grid-column: 1/-1;">No movies found for this mood yet!</p>`;
                        return;
                    }

                    // Performance Tip: Limit to 24 movies for smoother scrolling on 8GB RAM
                    movies.slice(0, 24).forEach(m => {
                        const safeTitle = m.title ? m.title.replace(/'/g, "\\'") : "Unknown";
                        const safeDesc = m.description ? m.description.replace(/'/g, "\\'") : "No description.";
                        const safeDirector = m.director ? m.director.replace(/'/g, "\\'") : "N/A";
                        const safeCast = m.cast ? m.cast.replace(/'/g, "\\'") : "N/A";
                        const safeOtt = m.ottPlatforms ? m.ottPlatforms.replace(/'/g, "\\'") : "N/A";

                        resultsDiv.innerHTML += `
                            <div class="movie-card" onclick="showDetails('${safeTitle}', '${safeDesc}', '${m.trailerUrl}', '${safeOtt}', '${safeDirector}', '${safeCast}', '${m.runtime}')">
                                <div class="movie-card-info">
                                    <h4>${m.title}</h4>
                                    <p style="color:#888; font-size:0.85rem; margin:8px 0;">${m.genre} • ${m.runtime}</p>
                                </div>
                            </div>`;
                    });
                })
                .catch(err => {
                    resultsDiv.innerHTML = `<p style="color:#e50914; grid-column: 1/-1;">Error connecting to server.</p>`;
                });
        }

        // --- 3. Modal Logic ---
        function showDetails(title, desc, trailer, ott, director, cast, runtime) {
            const modal = document.getElementById("movieModal");
            const modalBody = document.getElementById("modal-body");
            
            modalBody.innerHTML = `
                <iframe src="${trailer}" allowfullscreen></iframe>
                <div class="modal-info">
                    <h1 style="color:#e50914; margin:0 0 10px 0; font-size:2.5rem;">${title}</h1>
                    <p style="font-size:1.1rem; color:#fff;">${runtime} | ${director}</p>
                    <p style="margin:20px 0; line-height:1.6; color:#bbb;">${desc}</p>
                    <p><strong>Cast:</strong> ${cast}</p>
                    <p><strong>Available on:</strong> <span style="color:#e50914; font-weight:bold;">${ott}</span></p>
                </div>
            `;
            modal.style.display = "block";
            document.body.style.overflow = "hidden"; // Stop background scroll
        }

        function closeModal() {
            document.getElementById("movieModal").style.display = "none";
            document.getElementById("modal-body").innerHTML = ""; // Stop video
            document.body.style.overflow = "auto";
        }

        window.onclick = function(e) {
            if (e.target == document.getElementById("movieModal")) closeModal();
        }
    </script>
</body>
</html>
